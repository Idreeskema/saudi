<div class="dashboard-wrapper">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="breadcrumb">
        <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
          </svg></i>
        <span>/ STUDENT'S APPEAL FORM</span>
      </div>

      <button class="menu-toggle">
        <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg></i>
      </button>

      <div class="top-nav-right">
        <button class="year-selector">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z" />
            </svg></i>
          All Years
          <i class="arrow">▼</i>
        </button>

        <div class="user-menu">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg></i>
          <span>{{ currentUser?.name }}</span>
          <i class="arrow">▶</i>
        </div>

        <button class="icon-btn" (click)="logout()">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
            </svg></i>
        </button>

        <button class="icon-btn">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
            </svg></i>
        </button>
      </div>
    </header>

    <!-- Form Header -->
    <div class="form-header">
      <div class="form-logos">
        <!-- <img src="assets/ncaaa-logo.png" alt="NCAAA" class="logo"> -->
      </div>
      <div class="form-title">
        <h1>نموذج مراجعة نتيجة</h1>
        <h2>Student's Appeal Form</h2>
      </div>
      <div class="form-logos">
        <!-- <img src="assets/riyadh-logo.png" alt="Riyadh University" class="logo"> -->
      </div>
    </div>

    <!-- Form Content -->
    <div class="appeal-form">

      <!-- Student Information Section -->
      <div class="form-section" *ngIf="canViewSection('student')">

        <!-- Student ID -->
        <div class="form-group id-group">
          <label class="id-label">
            <span>Student's ID No.</span>
            <span class="arabic">الرقم الجامعي</span>
          </label>
          <input type="text" class="form-control" [(ngModel)]="formData.studentId"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Student Name -->
        <div class="form-group">
          <label>
            <span>Student's Name</span>
            <span class="arabic">اسم الطالب/ الطالبة</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.studentName"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Program -->
        <div class="form-group">
          <label>
            <span>Program</span>
            <span class="arabic">التخصص:</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.program"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Course Name and Code -->
        <div class="form-group">
          <label>
            <span>Name of Course</span>
            <span class="arabic">اسم المقرر:</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.courseName"
            [disabled]="!canEditSection('student')">
        </div>

        <div class="form-group">
          <label>
            <span>Course Code</span>
            <span class="arabic">رمز المقرر:</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.courseCode"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Level -->
        <div class="form-group">
          <label>
            <span>Level</span>
            <span class="arabic">المستوى</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.level"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Mark of Continuous Assessment -->
        <div class="form-group">
          <label>
            <span>Mark of Continuous Assessment</span>
            <span class="arabic">درجة الأعمال الفصلية:</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.continuousAssessmentMark"
            [disabled]="!canEditSection('student')">
        </div>

        <!-- Course Director's Name -->
        <div class="form-group">
          <label>
            <span>Course Director's Name</span>
            <span class="arabic">مدرس المقرر</span>
          </label>
          <input type="text" class="form-control underline" [(ngModel)]="formData.courseDirectorName"
            [disabled]="!canEditSection('student')">
        </div>
      </div>

      <!-- Reason Section -->
      <div class="reason-section" *ngIf="canViewSection('student')">
        <div class="reason-header">
          <h3>
            <span>Reason <span class="required">*</span></span>
            <span class="arabic">الأسباب <span class="required">*</span></span>
          </h3>
        </div>

        <textarea class="reason-textarea" [(ngModel)]="formData.reason" [disabled]="!canEditSection('student')"
          placeholder="Enter the reason for appeal..."
          [class.is-invalid]="reasonSubmitted && !formData.reason.trim()">
        </textarea>
        <span class="error-message" *ngIf="reasonSubmitted && !formData.reason.trim()">
          Reason is required.
        </span>
      </div>

      <!-- Note Section -->
      <div class="note-section">
        <p class="note-text arabic">
          يرسل النموذج لرئيس القسم / مدرس المقرر عن طريق البريد الإلكتروني
        </p>
      </div>

      <!-- Signature Section -->
      <div class="signature-section" *ngIf="canViewSection('student')">
        <div class="signature-row">
          <div class="date-field">
            <label>
              <span>Date</span>
              <span class="arabic">التاريخ :</span>
            </label>
            <input type="date" min="1900-01-01" max="2099-12-31" class="form-control" [(ngModel)]="formData.studentDate"
              [disabled]="!canEditSection('student')">
          </div>

          <div class="signature-field">
            <label>
              <span>Student's Signature</span>
              <span class="arabic">توقيع الطالب:</span>
            </label>
            <input type="text" class="signature-input" [(ngModel)]="formData.studentSignature"
              [disabled]="!canEditSection('student')">
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button class="btn btn-cancel" (click)="cancel()">Cancel</button>
        <!-- <button class="btn btn-save" (click)="saveForm()" *ngIf="canEditAnySection()">Save Form</button> -->
        <button class="btn btn-submit" (click)="submitForm()" *ngIf="canSubmitForm()">Submit Appeal</button>
      </div>
    </div>

    <!-- Contact Footer -->
    <div class="form-footer">
      <div class="footer-content">
        <span class="form-number">Form No. 7</span>
        <div class="contact-info">
          <span>🌐 www.riyadh.edu.sa</span>
          <span>📧 admissionriyadh.edu.sa</span>
          <span>📞 920000842</span>
        </div>
        <span class="form-number arabic">نموذج رقم ٧</span>
      </div>
    </div>
  </main>
</div>
