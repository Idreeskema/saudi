<div class="dashboard-wrapper">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="breadcrumb">
        <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg></i>
        <span>/ LIST SEQUENCES</span>
      </div>

      <button class="menu-toggle">
        <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg></i>
      </button>

      <div class="top-nav-right">
        <button class="year-selector">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg></i>
          All Years
          <i class="arrow">▼</i>
        </button>

        <div class="user-menu">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg></i>
          <span>{{ currentUser?.name }}</span>
          <i class="arrow">▶</i>
        </div>

        <button class="icon-btn" (click)="logout()">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg></i>
        </button>

        <button class="icon-btn">
          <i class="icon"><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg></i>
        </button>
      </div>
    </header>

    <!-- Sequences List -->
    <div class="sequence-section" *ngFor="let sequence of sequences">
      <h2 class="sequence-title">{{ sequence.title }}</h2>

      <div class="sequence-table">
        <div class="table-header">
          <div class="col-status">SEQUENCE STATUS</div>
          <div class="col-next">NEXT SEQUENCE</div>
          <div class="col-previous">PREVIOUS SEQUENCE</div>
          <div class="col-options">OPTIONS SEQUENCE</div>
          <div class="col-status-main">STATUS</div>
          <div class="col-action">ACTION</div>
        </div>

        <div class="table-row" *ngFor="let row of sequence.rows">
          <div class="col-status">
            <span class="badge" [ngClass]="row.sequenceStatus.class">
              {{ row.sequenceStatus.text }}
            </span>
          </div>
          <div class="col-next">
            <span class="badge" [ngClass]="row.nextSequence.class">
              {{ row.nextSequence.text }}
            </span>
          </div>
          <div class="col-previous">
            <span class="badge" [ngClass]="row.previousSequence.class">
              {{ row.previousSequence.text }}
            </span>
          </div>
          <div class="col-options">
            <span class="badge" [ngClass]="row.optionsSequence.class">
              {{ row.optionsSequence.text }}
            </span>
          </div>
          <div class="col-status-main">
            <span class="status-active">
              <span class="dot"></span>
              Active
            </span>
          </div>
          <div class="col-action">
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h4l3 3 3-3h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 3.3c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM18 16H6v-.9c0-2 4-3.1 6-3.1s6 1.1 6 3.1v.9z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
