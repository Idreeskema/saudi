<div class="login-page">
  <div class="login-background">
    <img src="assets/images/lab-image.jpg" alt="Laboratory" class="background-image" />
    <div class="background-overlay"></div>
  </div>

  <div class="login-card">
    <div class="logo-section">
      <div class="logo-mark">
        <span class="logo-letter logo-letter-r">R</span><span class="logo-letter logo-letter-e">E</span><span
          class="logo-letter logo-letter-u">U</span>
      </div>
      <div class="logo-caption">جامعة الرياض للعلم</div>
    </div>

    <div class="title-block">
      <h1 class="portal-title">Postgraduate Portal</h1>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" #usernameField="ngModel" required
          placeholder="Enter Username" class="form-control" />
        <p class="field-hint" *ngIf="usernameField.invalid && (usernameField.touched || submitted)">
          This field is required.
        </p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" #passwordField="ngModel" required
          placeholder="Enter Password" class="form-control" />
        <p class="field-hint" *ngIf="passwordField.invalid && (passwordField.touched || submitted)">
          This field is required.
        </p>
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember" [(ngModel)]="rememberMe" name="rememberMe" class="form-check-input" />
        <label for="remember" class="form-check-label">Remember me</label>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">SIGN IN</button>
        <button type="button" class="btn btn-gmail" (click)="loginWithGmail()" aria-label="Sign in with Google">
          <span class="google-icon">G</span>
        </button>
      </div>
    </form>

    <div class="help-section">
      <p>Need help? Please email: <a href="mailto:Postgraduate@riyadh.edu.sa">Postgraduateriyadh.edu.sa</a></p>
    </div>

    <!-- Demo Login Helper -->
    <div class="demo-helper">
      <p><strong>Demo Accounts (password: password123):</strong></p>
      <div class="demo-accounts">
        <select [(ngModel)]="selectedAccount" name="selectedAccount" class="form-control">
          <option value="">Select Role</option>
          <option *ngFor="let account of demoAccounts" [value]="account.email">
            {{ account.label }}
          </option>
        </select>
        <button (click)="quickLogin()" [disabled]="!selectedAccount" class="btn btn-sm btn-outline-secondary">
          Login as Selected
        </button>
      </div>
    </div>
  </div>
</div>
