<div class="login-container">
  <div class="login-left">
    <div class="login-form-wrapper">
      <div class="logo-section">
        <!-- <div class="logo-icon">A Z</div> -->
      </div>

      <h1 class="portal-title">Postgraduate Portal</h1>
      <h2 class="welcome-text">Welcome back</h2>
      <p class="instruction-text">Enter Username and password to sign in</p>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Username"
            class="form-control" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Password"
            class="form-control" />
        </div>

        <div class="form-check">
          <input type="checkbox" id="remember" [(ngModel)]="rememberMe" name="rememberMe" class="form-check-input" />
          <label for="remember" class="form-check-label">Remember me</label>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">SIGN IN</button>
          <button type="button" class="btn btn-gmail" (click)="loginWithGmail()">GMAIL</button>
        </div>
      </form>

      <div class="help-section">
        <!-- <div class="help-icon">A Z</div> -->
        <p>Need help? Please email: <a href="mailto:Postgraduate@riyadh.edu.sa">Postgraduateriyadh.edu.sa</a></p>
      </div>

      <!-- Demo Login Helper -->
      <div class="demo-helper">
        <p><strong>Demo Accounts (password: password123):</strong></p>
        <div class="demo-accounts">
          <select [(ngModel)]="selectedAccount" name="selectedAccount" class="form-control">
            <option value="">Select Role</option>
            <option *ngFor="let account of demoAccounts" [value]="account.email">
              {{ account.label }}
            </option>
          </select>
          <button (click)="quickLogin()" [disabled]="!selectedAccount" class="btn btn-sm btn-outline-secondary">
            Login as Selected
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="login-right">
    <img src="assets/images/lab-image.jpg" alt="Laboratory" class="background-image" />
  </div>
</div>
